name: deploy

on:
  push:
    branches: [dev, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    name: deploy web10-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to box
        uses: appleboy/ssh-action@v1
        env:
          STACK: web10-dev
          ENV: dev
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 42422
          envs: STACK,ENV,GITHUB_SHA,GITHUB_REF
          script: |
            set -e
            echo "=== Deploying $STACK ==="
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"

# Pull latest code (robust even for single-branch clones:
            # fetch the branch explicitly, then force the local branch to it)
            cd /opt/web10
            git fetch origin dev
            git checkout -B dev FETCH_HEAD

            # Restore .env symlink if broken (GitOps re-clone can wipe it)
            if [[ ! -L ubuntu-deployment/.env ]] || [[ ! -f ubuntu-deployment/.env ]]; then
              ln -sfn ~/web10-ops/.env ubuntu-deployment/.env
            fi

            # Source env for per-stack vars
            set -a
            source ubuntu-deployment/.env
            set +a

            # Compute status vars for the baked status.json (E9)
            export GIT_COMMIT=$(git rev-parse --short HEAD)
            export STATUS_VERSION=$(head -1 CHANGELOG.md | sed 's/[| ].*//' | tr -d '[:space:]')

            # Build and deploy the stack
            cd ubuntu-deployment
            docker compose -p $STACK \
              --env-file env.$ENV \
              -f docker-compose.ecosystem.yml \
              up -d --build --remove-orphans

            # Wait for containers to stabilize
            echo "=== Waiting for containers to stabilize ==="
            for i in $(seq 1 30); do
              unhealthy=$(docker ps --filter "name=$STACK" --filter "status=unhealthy" --format '{{.Names}}' | wc -l)
              restarting=$(docker ps --filter "name=$STACK" --filter "status=restarting" --format '{{.Names}}' | wc -l)
              if [[ "$unhealthy" -eq 0 ]] && [[ "$restarting" -eq 0 ]]; then
                echo "All containers stable"
                break
              fi
              if [[ "$i" -eq 30 ]]; then
                echo "FAIL: containers still unstable after 30s"
                docker ps --filter "name=$STACK" --format 'table {{.Names}}\t{{.Status}}'
                exit 1
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            # Show container status
            echo "=== Container status ==="
            docker ps --filter "name=$STACK" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'

            # Run smoke test
            echo "=== Running smoke test ==="
            bash scripts/smoke.sh

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    name: deploy web10-prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to box
        uses: appleboy/ssh-action@v1
        env:
          STACK: web10-prod
          ENV: prod
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 42422
          envs: STACK,ENV,GITHUB_SHA,GITHUB_REF
          script: |
            set -e
            echo "=== Deploying $STACK ==="
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"

# Pull latest code (robust even for single-branch clones:
            # fetch the branch explicitly, then force the local branch to it)
            cd /opt/web10
            git fetch origin main
            git checkout -B main FETCH_HEAD

            # Restore .env symlink if broken
            if [[ ! -L ubuntu-deployment/.env ]] || [[ ! -f ubuntu-deployment/.env ]]; then
              ln -sfn ~/web10-ops/.env ubuntu-deployment/.env
            fi

            # Source env for per-stack vars
            set -a
            source ubuntu-deployment/.env
            set +a

            # Compute status vars for the baked status.json (E9)
            export GIT_COMMIT=$(git rev-parse --short HEAD)
            export STATUS_VERSION=$(head -1 CHANGELOG.md | sed 's/[| ].*//' | tr -d '[:space:]')

            # Build and deploy the stack
            cd ubuntu-deployment
            docker compose -p $STACK \
              --env-file env.$ENV \
              -f docker-compose.ecosystem.yml \
              up -d --build --remove-orphans

            # Wait for containers to stabilize
            echo "=== Waiting for containers to stabilize ==="
            for i in $(seq 1 30); do
              unhealthy=$(docker ps --filter "name=$STACK" --filter "status=unhealthy" --format '{{.Names}}' | wc -l)
              restarting=$(docker ps --filter "name=$STACK" --filter "status=restarting" --format '{{.Names}}' | wc -l)
              if [[ "$unhealthy" -eq 0 ]] && [[ "$restarting" -eq 0 ]]; then
                echo "All containers stable"
                break
              fi
              if [[ "$i" -eq 30 ]]; then
                echo "FAIL: containers still unstable after 30s"
                docker ps --filter "name=$STACK" --format 'table {{.Names}}\t{{.Status}}'
                exit 1
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            # Show container status
            echo "=== Container status ==="
            docker ps --filter "name=$STACK" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'

            # Run smoke test
            echo "=== Running smoke test ==="
            bash scripts/smoke.sh
