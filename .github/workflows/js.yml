name: js-check

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      tests:
        # rtc has no test suite yet — callers set this false rather than
        # letting the test step fail on a package with nothing to run
        required: false
        type: boolean
        default: true

jobs:
  check:
    name: ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run tsc --noEmit || bunx tsc --noEmit

      - name: test
        if: ${{ inputs.tests }}
        run: bun run test:run

      - name: build
        run: bun run build
