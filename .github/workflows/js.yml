name: js-check

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      tests:
        # Packages can opt out only when they have no test suite.
        required: false
        type: boolean
        default: true

jobs:
  check:
    name: ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ${{ inputs.package }}/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ inputs.package }}-${{ hashFiles(format('{0}/bun.lock', inputs.package)) }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ inputs.package }}-

      - name: bun install
        run: bun install --frozen-lockfile

      - name: Set up Python for RTC interoperability tests
        if: ${{ inputs.package == 'api/rtc' }}
        uses: astral-sh/setup-uv@v7

      - name: Install RTC test backend dependencies
        if: ${{ inputs.package == 'api/rtc' }}
        working-directory: api
        run: uv sync --frozen

      - name: typecheck
        run: bun run tsc --noEmit || bunx tsc --noEmit

      - name: test
        if: ${{ inputs.tests }}
        run: bun run test:run

      - name: build
        run: bun run build
