name: cd

on:
  push:
    branches: [main]
    tags:
      - 'v*'

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: jacoby149

jobs:
  images:
    name: publish images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: api
          - name: ui
            context: ui
            target: build
          - name: rtc
            context: api/rtc
          - name: marketing-ui
            context: marketing/marketing-ui
    steps:
      - uses: actions/checkout@v4

      - name: Extract git info for status.json
        id: git
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(head -1 knowledge/changelogs/CHANGELOG.md | sed 's/[| ].*//' | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/web10-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push ${{ matrix.service.name }}
        if: matrix.service.name != 'marketing-ui'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile || format('{0}/Dockerfile', matrix.service.context) }}
          target: ${{ matrix.service.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push marketing-ui
        if: matrix.service.name == 'marketing-ui'
        uses: docker/build-push-action@v6
        with:
          # Repo-root context so build-status.sh can read CHANGELOG.md +
          # .git to bake status.json. (Mirrors docker-compose.ecosystem.yml
          # which sets context: .. for the same service.) The Dockerfile
          # itself lives in marketing/marketing-ui/.
          context: .
          file: marketing/marketing-ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VITE_GIT_COMMIT=${{ steps.git.outputs.commit }}
            STATUS_VERSION=${{ steps.git.outputs.version }}

  npm-publish-web10-npm:
    name: publish web10-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: bun install
        run: bun install --frozen-lockfile

      - name: build
        run: bun run build

      - name: publish to npm
        run: npm publish --provenance --access public

  npm-publish-web10-cli:
    name: publish web10-cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: marketing/web10-cli
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: bun install
        run: bun install --frozen-lockfile

      - name: publish to npm
        run: npm publish --provenance --access public

  release:
    name: github release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [images, npm-publish-web10-npm, npm-publish-web10-cli]
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes
        id: notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Grab entries from CHANGELOG.md up to the matching version or next tag
          awk -v tag="$TAG" '
            BEGIN { found=0 }
            $0 ~ tag { found=1; next }
            found && /^ *[0-9]+\.[0-9]+\.[0-9]+/ { found=0 }
            found && NF { print }
          ' knowledge/changelogs/CHANGELOG.md > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "No changelog entries found for tag $TAG"
            echo "$TAG" > release_notes.txt
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.txt
          generate_release_notes: false