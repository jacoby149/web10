name: api

on:
  pull_request:
    paths:
      - api/**
      - media-delivery/**
      - ubuntu-deployment/docker-compose.ecosystem.yml
      - ubuntu-deployment/env.*.example
      - ubuntu-deployment/scripts/heal-phone-videos.py
      - marketing/marketing-ui/Dockerfile
      - marketing/web10-social/Dockerfile
      - .github/workflows/api.yml
      - .github/workflows/docker.yml

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: api (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: uv sync
        run: uv sync --frozen --extra test

      - name: ruff check
        run: uv run ruff check . ../ubuntu-deployment/scripts/heal-phone-videos.py

      - name: ruff format
        run: uv run ruff format --check . ../ubuntu-deployment/scripts/heal-phone-videos.py

      - name: pytest
        run: uv run pytest

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Protected media edge and Python interoperability
        run: node --test ../media-delivery/delivery.test.mjs tests/media_delivery_interop.test.mjs
