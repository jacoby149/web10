name: research

on:
  pull_request:
    paths:
      - research/experiments/costfn/**
      - .github/workflows/research.yml

permissions:
  contents: read

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: research (offline contracts + regressions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install pinned research dependencies
        run: python -m pip install -r research/experiments/costfn/realism-requirements.txt ruff==0.15.22 bcrypt==5.0.0
      - name: Lint changed research surface
        run: ruff check research/experiments/costfn/realism*.py research/experiments/costfn/core_feed.py
      - name: Create disposable local scratch root
        run: mkdir -p .context
      - name: Run network-free research controls
        working-directory: research/experiments/costfn
        run: |
          python realism.test.py
          python realism_scratch.test.py
          python realism_cloud_lease.test.py
          python realism_cloud_worker.test.py
          python realism_parity.test.py
          python realism_resume.test.py
          python study_v2.test.py
          python dataset.test.py
      - name: Verify offline source captures
        working-directory: research/experiments/costfn
        run: bun test capture-feed.test.ts capture-pagination.test.ts
