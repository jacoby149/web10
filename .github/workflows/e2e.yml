name: e2e

on:
  push:
    branches:
      - dev
      - main
    paths:
      - e2e/**
      - sdk/**
      - ui/**
      - marketing/web10-social/**
      - marketing/marketing-ui/**
      - api/**
      - docker-compose.yml
      - .github/workflows/e2e.yml
  pull_request:
    branches:
      - dev
      - main
    paths:
      - e2e/**
      - sdk/**
      - ui/**
      - marketing/web10-social/**
      - marketing/marketing-ui/**
      - api/**
      - docker-compose.yml
      - .github/workflows/e2e.yml

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e smoke (playwright)
    # Self-hosted runner on the web10 box (8 cores) — the ubuntu-latest 2-core
    # VM timed out the ~389-test serial suite at the 15-min cap. The box runs
    # the e2e stack on non-default ports (8090/9100/9101) so it doesn't collide
    # with the live dev/prod stacks (80/443/9000). `*.localhost` vhost names are
    # forced to 127.0.0.1 in the box's /etc/hosts so the proxy is reachable.
    runs-on: [self-hosted, web10-e2e]
    timeout-minutes: 25
    env:
      E2E_HTTP_PORT: "8090"
      E2E_MINIO_PORT: "9100"
      E2E_MINIO_CONSOLE_PORT: "9101"
      # 2, not 4: the box shares 8 cores with the live dev/prod stacks, and 4
      # workers push the slowest tests (30s P2P/WebRTC, 15s membership polls)
      # past their timeouts. 2 keeps ~2x the old serial speed without the flake.
      E2E_WORKERS: "2"
    steps:
      - uses: actions/checkout@v7

      - name: Build & start e2e stack
        run: docker compose -f e2e/docker-compose.yml up --build -d
        env:
          STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}

      - name: Initialize ClickHouse schema
        run: |
          # Wait for CH to accept connections (bypassed entrypoint, so no auto-init)
          for i in $(seq 1 60); do
            if docker compose -f e2e/docker-compose.yml exec -T clickhouse clickhouse-client --user default --password "" -q "SELECT 1" 2>/dev/null; then
              echo "ClickHouse ready (attempt $i)"
              break
            fi
            sleep 2
          done
          # Create user + database
          docker compose -f e2e/docker-compose.yml exec -T clickhouse clickhouse-client --user default --password "" \
            -q "CREATE USER IF NOT EXISTS web10 IDENTIFIED BY 'web10'; CREATE DATABASE IF NOT EXISTS web10; GRANT ALL ON web10.* TO web10;"
          # Apply schema
          docker compose -f e2e/docker-compose.yml exec -T clickhouse clickhouse-client --user web10 --password web10 --database web10 \
            < clickhouse-init/001-init-v3-schema.sql.template
          docker compose -f e2e/docker-compose.yml exec -T clickhouse clickhouse-client --user web10 --password web10 --database web10 \
            < clickhouse-init/002-logs-table.sql.template
          echo "Schema initialized."

      - name: Wait for stack health
        run: bash e2e/wait-for-stack.sh
        env:
          TIMEOUT: 300

      - name: Setup Playwright
        working-directory: e2e
        run: |
          npm install
          # No --with-deps: the runner is non-root (ci-runner). The chromium
          # system libraries are pre-installed on the box; this just ensures
          # the browser is in the runner's cache (idempotent, no root needed).
          npx playwright install chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test
        env:
          STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}

      - name: Dump stack logs on failure
        if: failure()
        run: |
          echo "=== ClickHouse logs (stdout) ==="
          docker compose -f e2e/docker-compose.yml logs clickhouse 2>&1 | tail -80
          echo "=== ClickHouse err.log (via cp from stopped container) ==="
          docker cp e2e-clickhouse-1:/var/log/clickhouse-server/clickhouse-server.err.log /tmp/ch-err.log 2>/dev/null && tail -40 /tmp/ch-err.log || echo "(could not extract)"
          echo "=== ClickHouse main log ==="
          docker cp e2e-clickhouse-1:/var/log/clickhouse-server/clickhouse-server.log /tmp/ch.log 2>/dev/null && tail -40 /tmp/ch.log || echo "(could not extract)"
          echo "=== API logs (errors + last 200) ==="
          docker compose -f e2e/docker-compose.yml logs api 2>&1 | grep -iE "error|exception|traceback|500|refused|timeout|clickhouse" | tail -60
          echo "--- API tail ---"
          docker compose -f e2e/docker-compose.yml logs api 2>&1 | tail -200
          echo "=== Container status ==="
          docker compose -f e2e/docker-compose.yml ps -a

      - name: Upload Playwright traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v