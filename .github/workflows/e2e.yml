name: e2e

on:
  push:
    branches:
      - dev
      - main
    paths:
      - e2e/**
      - sdk/**
      - ui/**
      - marketing/web10-social/**
      - marketing/marketing-ui/**
      - api/**
      - docker-compose.yml
      - .github/workflows/e2e.yml
  pull_request:
    branches:
      - dev
      - main
    paths:
      - e2e/**
      - sdk/**
      - ui/**
      - marketing/web10-social/**
      - marketing/marketing-ui/**
      - api/**
      - docker-compose.yml
      - .github/workflows/e2e.yml

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e shard ${{ matrix.shard }}/4
    # GitHub-HOSTED runners, 4-shard matrix. Each leg is its own isolated VM, so
    # the 4 shards run in PARALLEL (no single-runner serialization) and each uses
    # default ports (80/9000) — no port juggling, no docker-project prefixes, no
    # /etc/hosts hacks. The spec split + per-shard worker count live in
    # e2e/shards.json (the "global-config" shard runs workers=1 so the global
    # node_config mutations in node-ads + moderation never race).
    #
    # To go faster: bump `runs-on` to a larger hosted runner (e.g. a 4-vCPU
    # runner) — each shard gets more CPU for its browser workers. Standard
    # ubuntu-latest (2 vCPU) is the baseline.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run shard ${{ matrix.shard }} (own stack + spec slice)
        working-directory: e2e
        run: bash run-shard.sh ${{ matrix.shard }}

      - name: Dump stack logs on failure
        if: failure()
        run: |
          echo "=== API logs (errors + last 100) ==="
          docker compose -f e2e/docker-compose.yml logs api 2>&1 | grep -iE "error|exception|traceback|500|refused|timeout|clickhouse" | tail -40
          echo "--- API tail ---"
          docker compose -f e2e/docker-compose.yml logs api 2>&1 | tail -100
          echo "=== Container status ==="
          docker compose -f e2e/docker-compose.yml ps -a

      - name: Upload Playwright traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: e2e/test-results/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v