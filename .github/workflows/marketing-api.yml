name: marketing-api

on:
  pull_request:
    paths:
      - marketing/marketing-api/**
      - .github/workflows/marketing-api.yml

concurrency:
  group: marketing-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: marketing-api (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: marketing/marketing-api
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: marketing/marketing-api/uv.lock

      - name: uv sync
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest
