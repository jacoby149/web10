name: docker

on:
  pull_request:
    paths:
      - '**/Dockerfile'
      - api/**
      - ui/**
      - sdk/**
      - marketing/marketing-ui/**
      - .github/workflows/docker.yml

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: api
          - name: ui
            context: ui
            target: build
          - name: sdk
            context: sdk
          - name: rtc
            context: api/rtc
          - name: marketing-ui
            # Repo-root context so the Dockerfile can COPY CHANGELOG.md + .git
            # (build-status.sh bakes status.json from them). Cache key stays
            # scoped to the marketing-ui dir via hashPath so it doesn't hash
            # the whole repo. Mirrors cd.yml + docker-compose.ecosystem.yml.
            context: .
            dockerfile: marketing/marketing-ui/Dockerfile
            hashPath: marketing/marketing-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-${{ matrix.service.name }}
          key: ${{ runner.os }}-buildx-${{ matrix.service.name }}-${{ hashFiles(format('{0}/**', matrix.service.hashPath || matrix.service.context)) }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.service.name }}-

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile || format('{0}/Dockerfile', matrix.service.context) }}
          target: ${{ matrix.service.target }}
          push: false
          load: false
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.service.name }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.service.name }},mode=max
          platforms: linux/amd64
