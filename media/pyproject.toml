[project]
name = "web10-media"
version = "0.1.0"
description = "web10 media service - S3 presigned URLs and metadata records"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23",
    "PyJWT>=2.9",
    "pymongo>=4.8",
    "boto3>=1.35",
    "python-multipart>=0.0.10",
    "requests>=2.32",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-mock>=3.12",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
