# Standalone disposable experiment. Never combine with the root compose stack.
x-source: &source
  org.opencontainers.image.revision: ${SOURCE_REVISION:?runner required}

services:
  proxy:
    image: ghcr.io/jacoby149/base-nginx:alpine
    ports: ["127.0.0.1:80:80"]
    volumes: ["./proxy.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api, ui, social, rtc]
  clickhouse:
    image: ghcr.io/jacoby149/base-clickhouse:24.8
    environment:
      CLICKHOUSE_DB: web10
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: disposable
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "disposable", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 60
    ulimits:
      nofile: {soft: 262144, hard: 262144}
  minio:
    image: ghcr.io/jacoby149/base-minio:latest
    command: [server, /data, --console-address, ":9001"]
    ports: ["127.0.0.1:9000:9000"]
    environment:
      MINIO_ROOT_USER: disposable
      MINIO_ROOT_PASSWORD: disposable-minio-only
    volumes: ["minio-data:/data"]
  api:
    build:
      context: ../../../api
      labels: *source
    environment:
      PROVIDER: api.localhost
      PRIVATE_KEY: ${EVAL_SIGNING_KEY:?runner required}
      CORS_SERVICE_MANAGERS: auth.localhost
      DEFAULT_ADMINS: evaladmin
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: web10
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: disposable
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: disposable
      S3_SECRET_KEY: disposable-minio-only
      S3_BUCKET: web10-media
      S3_USE_SSL: "false"
      S3_PUBLIC_USE_SSL: "false"
      TWILIO_E2E: "true"
      TWILIO_ACCOUNT_SID: AC_disposable
      TWILIO_AUTH_TOKEN: disposable
      STRIPE_STATUS: test
      STRIPE_TEST_KEY: sk_test_placeholder
      STRIPE_LIVE_KEY: ""
    depends_on:
      clickhouse: {condition: service_healthy}
      minio: {condition: service_started}
  ui:
    build:
      context: ../../..
      dockerfile: ui/Dockerfile
      labels: *source
      args:
        REACT_APP_AUTH_ORIGIN: http://auth.localhost
        REACT_APP_API_ORIGIN: http://api.localhost
        REACT_APP_RTC_ORIGIN: http://rtc.localhost
        REACT_APP_DEFAULT_API: api.localhost
        VITE_GA4_MEASUREMENT_ID: ""
        VITE_HOTJAR_SITE_ID: ""
    environment:
      SERVER_PORT: "80"
      SERVER_FALLBACK_PAGE: index.html
  social:
    build:
      context: ../../..
      dockerfile: marketing/web10-social/Dockerfile
      labels: *source
      args:
        VITE_API_ORIGIN: http://api.localhost
        VITE_AUTH_ORIGIN: http://auth.localhost
        VITE_RTC_ORIGIN: http://rtc.localhost
        VITE_MARKETING_ORIGIN: http://marketing.localhost
        VITE_GIT_COMMIT: ${SOURCE_REVISION}
        VITE_GA4_MEASUREMENT_ID: ""
        VITE_HOTJAR_SITE_ID: ""
    environment:
      API_PROXY_TARGET: http://api
      API_ORIGIN: http://api
  rtc:
    build:
      context: ../../../api/rtc
      labels: *source
    environment:
      PORT: "80"
      CERTIFY_BASE_URL: http://api

volumes:
  clickhouse-data:
  minio-data:

# Runtime containers have no external route. Build-time registry access is separate.
networks:
  default:
    internal: true
