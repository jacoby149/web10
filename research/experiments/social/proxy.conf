map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    server_name _;
    location / { return 444; }
}
server {
    listen 80;
    server_name localhost;
    location = /__experiment {
        limit_except GET { deny all; }
        default_type application/json;
        return 200 '{"experiment":"web10-social-isolated"}';
    }
    location / { return 404; }
}
server {
    listen 80;
    server_name api.localhost;
    location = /__experiment {
        limit_except GET { deny all; }
        default_type application/json;
        return 200 '{"experiment":"web10-social-isolated"}';
    }
    location / {
        proxy_set_header Host $http_host;
        proxy_pass http://api:80;
    }
}
server {
    listen 80;
    server_name auth.localhost;
    location = /__experiment {
        limit_except GET { deny all; }
        default_type application/json;
        return 200 '{"experiment":"web10-social-isolated"}';
    }
    location / {
        proxy_set_header Host $http_host;
        proxy_pass http://ui:80;
    }
}
server {
    listen 80;
    server_name social.localhost;
    location = /__experiment {
        limit_except GET { deny all; }
        default_type application/json;
        return 200 '{"experiment":"web10-social-isolated"}';
    }
    client_max_body_size 512m;
    location / {
        proxy_set_header Host $http_host;
        proxy_pass http://social:80;
    }
}
server {
    listen 80;
    server_name rtc.localhost;
    location = /__experiment {
        limit_except GET { deny all; }
        default_type application/json;
        return 200 '{"experiment":"web10-social-isolated"}';
    }
    location / {
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_pass http://rtc:80;
    }
}
server {
    listen 80;
    server_name marketing.localhost;
    location / {
        default_type text/html;
        return 200 '<!doctype html><title>Disposable social evaluation</title><p>Synthetic local fixture only.</p>';
    }
}
