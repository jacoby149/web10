services:
  api:
    # Repo-root context (api/Dockerfile bakes /web10/VERSION from the
    # changelog — the node's update check).
    build:
      context: ../../..
      dockerfile: api/Dockerfile
    depends_on:
      - clickhouse
      - minio
    ports:
      - "127.0.0.1:${API_PORT:-6000}:80"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: web10
      CLICKHOUSE_USER: web10
      CLICKHOUSE_PASSWORD: web10
      S3_ENDPOINT: http://minio:9000
      QUERY_EVAL_NO_POLICY: "${QUERY_EVAL_NO_POLICY:-0}"
      QUERY_EVAL_STUB_EXECUTE: "${QUERY_EVAL_STUB_EXECUTE:-0}"
      QUERY_EVAL_STUB_ROWS: "${QUERY_EVAL_STUB_ROWS:-20}"
      QUERY_EVAL_READABLE_MODE: "${QUERY_EVAL_READABLE_MODE:-per-group}"
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80"]
  clickhouse:
    image: ghcr.io/jacoby149/base-clickhouse:24.3
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../../../clickhouse-init:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: web10
      CLICKHOUSE_USER: web10
      CLICKHOUSE_PASSWORD: web10
  minio:
    image: ghcr.io/jacoby149/base-minio:latest
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
volumes:
  clickhouse-data:
  minio-data:
