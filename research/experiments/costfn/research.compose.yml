# Explicit research-only overlay; production app and routes remain untouched.
services:
  clickhouse:
    # Current app SQL uses QUALIFY (unsupported in historical 24.3).
    image: ghcr.io/jacoby149/base-clickhouse:24.8
    # PROTOCOL §6/§11: Docker allocations pinned and recorded per run. The
    # 09.11.2026 K=20/1M trial without this cap OOM-killed the ClickHouse
    # server (container exit 137) inside the shared Docker VM — recorded as a
    # setup failure, not data. 5 GB matches the earlier local 1M runs
    # (#1464 matched-dates record). Data stays on the volume (VM disk has
    # headroom), not tmpfs: the VM RAM also hosts the API + other workspaces.
    mem_limit: 5g
    # Restate the base volumes (compose replaces, not appends, list values on
    # merge) and add the server-memory throttle config so CH backpressures
    # (code 241) under the pinned cap instead of being cgroup OOM-killed.
    # The throttle is mounted as a SINGLE FILE into config.d (not the whole
    # directory): the base image ships config.d/docker_related_config.xml with
    # listen_host 0.0.0.0/::, and a directory bind would shadow it, leaving CH
    # on localhost-only and breaking the API's cross-container clickhouse:8123.
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../../../clickhouse-init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse-config/memory.xml:/etc/clickhouse-server/config.d/costfn-memory.xml:ro
  api:
    volumes:
      - ${COSTFN_RESEARCH_DIR:-.}:/research:ro
      - ${COSTFN_REPO_DIR:-../../..}/sdk/src:/source/sdk/src:ro
      - ${COSTFN_REPO_DIR:-../../..}/marketing/web10-social/src/data:/source/marketing/web10-social/src/data:ro
    environment:
      PYTHONPATH: /research:/web10
      COSTFN_DISPOSABLE: "1"
      COSTFN_SOURCE_ROOT: /source
      QUERY_EVAL_READABLE_MODE: "${COSTFN_RESOLVER:-batched}"
      # Arm D treatment switch (PROTOCOL §4): 0 = Arm A queries unchanged.
      COSTFN_ARM_D: "${COSTFN_ARM_D:-0}"
      # Phase-1.5 satellite treatment (PROTOCOL amendment): follow-up
      # counting via counting_numbers point seeks. Research-only.
      COSTFN_SATELLITE: "${COSTFN_SATELLITE:-0}"
    command: ["uv", "run", "uvicorn", "research_api:application", "--host", "0.0.0.0", "--port", "80", "--no-access-log"]
