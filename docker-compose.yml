services:
  api: # The web10 API, that holds all the data.
    build: api
    volumes:
      - ./api/:/web10
    ports:
      - "6000:80"
    environment:
      - VIRTUAL_HOST=api.localhost
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80", "--reload"]
    networks:
      - all-spark-proxy
  ui: # The web10 Authenticator, the UI for managing the web10 API
    build:
      context: auth2
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./auth2:/ui
      - ui-node-modules:/ui/node_modules
    command: ["bun", "run", "dev"]
    environment:
      PORT: 80
      VIRTUAL_HOST: auth.localhost
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - '3000:80'
  auth: # The web10 Authenticator (legacy), deprecated — will be removed in phase 2
    build:
      context: .
      dockerfile: auth/Dockerfile
      target: dev
    volumes:
      - ./auth:/auth
      - ./sdk:/auth/public/sdk
      - node-modules:/auth/node_modules
      - wapi-node-modules:/auth/public/sdk/node_modules
    command: ["bun", "run", "start"]
    environment:
      PORT: 80
      VIRTUAL_HOST: auth.localhost
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - '3001:80'
  rtc: # web10 RTC, responsible for webRTC P2P connections on web10.
    build: rtc
    volumes:
      - ./rtc:/rtc
      - rtc-node-modules:/rtc/node_modules
    command: ["bun", "run", "dev"]
    environment:
      PORT: 80
      VIRTUAL_HOST: rtc.localhost
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - '6363:80'
  docs: # web10 docs, the web10 documentation on how to use it as a developer
    build: sdk
    volumes:
      - ./sdk/:/docs/public
    ports:
      - "6969:80"
    environment:
      VIRTUAL_HOST: docs.localhost
  home: # web10 home, the homepage that explains the mission + about web10.
    build: home
    volumes:
      - ./home/:/home/public
    ports:
      - "6868:80"
    environment:
      VIRTUAL_HOST: home.localhost
  mail: # web10 mail, a demo app on web10 to check webRTC + cross communication is working.
    build:
      context: .
      dockerfile: mail/Dockerfile
    volumes:
      - ./mail/:/mail/public
      - ./sdk/:/mail/public/sdk
    ports:
      - "7171:80"
    environment:
      VIRTUAL_HOST: mail.localhost
  crm: # web10 CRM, a demo app on web10 to check core functionality / data management is working.
    build:
      context: .
      dockerfile: crm/Dockerfile
    volumes:
      - ./crm/:/crm/public
      - ./sdk/:/crm/public/sdk
    ports:
      - "7746:80"
    environment:
      VIRTUAL_HOST: crm.localhost
  media: # web10 media service - S3 presigned URLs and metadata records (Phase 5)
    build: media
    volumes:
      - ./media/:/web10
    ports:
      - "6001:80"
    environment:
      - VIRTUAL_HOST=media.localhost
      - PROVIDER=api.localhost
      - DB_URL=mongodb://api:27017
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80", "--reload"]
    networks:
      - all-spark-proxy
      - media-network
    depends_on:
      - minio
  minio: # S3-compatible object storage for media blobs (Phase 5)
    image: minio/minio:latest
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_CONSOLE_ADDRESS=:9001
    command: server /data --console-address :9001
    networks:
      - media-network

volumes:
  node-modules:
  wapi-node-modules:
  rtc-node-modules:
  ui-node-modules:
  minio-data:
networks:
  all-spark-proxy:
    external: true
  media-network:
    driver: bridge
