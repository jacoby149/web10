# web10 node — clone the repo and `docker compose up --build`, then open
# http://auth.localhost to see the getting-started (signup) screen.
#
# Everything a node needs is in here: the vhost proxy, the ClickHouse OLAP
# store, S3-compatible blob storage for media, the API, the admin/consent UI,
# the RTC signaling server, and the wapi.js CDN.
#
# On a host where something else owns port 80 (e.g. the staging Caddy),
# set WEB10_HTTP_PORT to move or free the local proxy.

services:
  proxy: # routes the *.localhost vhosts so the browser experience just works
    image: nginxproxy/nginx-proxy:1.6
    ports:
      - "${WEB10_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro

  api: # The web10 API, that holds all the data.
    build: api
    depends_on:
      - minio
      - clickhouse
    volumes:
      - ./api/:/web10
    ports:
      - "6000:80"
    environment:
      VIRTUAL_HOST: api.localhost
      PROVIDER: ${PROVIDER:-api.localhost}
      S3_ENDPOINT: http://minio.localhost:9000
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: web10
      CLICKHOUSE_USER: web10
      CLICKHOUSE_PASSWORD: web10
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80", "--reload"]

  ui: # The web10 Authenticator, the UI for managing the web10 API
    build:
      context: ui
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./ui:/ui
      - ui-node-modules:/ui/node_modules
    command: ["bun", "run", "dev"]
    environment:
      PORT: 80
      VIRTUAL_HOST: auth.localhost
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_DEFAULT_API: ${PROVIDER:-api.localhost}
      REACT_APP_VERIFY_REQUIRED: "false"
    ports:
      - "3000:80"

  rtc: # web10 RTC, responsible for webRTC P2P connections on web10.
    build: api/rtc
    volumes:
      - ./api/rtc:/rtc
      - rtc-node-modules:/rtc/node_modules
    command: ["bun", "run", "dev"]
    environment:
      PORT: 80
      VIRTUAL_HOST: rtc.localhost
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "6363:80"

  sdk: # serves wapi.js as a CDN (dist/) plus the sdk demos
    build: sdk
    volumes:
      - ./sdk/:/docs/public
    ports:
      - "6969:80"
    environment:
      VIRTUAL_HOST: sdk.localhost,docs.localhost

  clickhouse: # v3 OLAP store — ClickHouse with v3 schema init
    image: clickhouse/clickhouse-server:24.3
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
      - "9002:9000"
    environment:
      - CLICKHOUSE_DB=web10
      - CLICKHOUSE_USER=web10
      - CLICKHOUSE_PASSWORD=web10

  minio: # S3-compatible object storage for media blobs (Phase 5)
    image: minio/minio:latest
    networks:
      default:
        aliases:
          - minio.localhost # so presigned URLs work from containers AND the browser
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_CONSOLE_ADDRESS=:9001
    command: server /data --console-address :9001

volumes:
  rtc-node-modules:
  ui-node-modules:
  minio-data:
  clickhouse-data:
