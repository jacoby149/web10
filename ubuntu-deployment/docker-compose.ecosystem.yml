# web10 ecosystem stack — ONE parameterized compose for every env.
#
# This is the canonical stack file (plan.txt CROSS-CUTTING deployment:
# "one compose file parameterized by env — never two divergent
# composes"). The same file deploys as two Portainer stacks:
#
#   stack name    STACK env    DNS                      exposure
#   web10-dev     web10-dev    *.dev.{zone} → LAN IP    VPN-only
#   web10-prod    web10-prod   *.{zone} → public IP     public
#
# Per-stack env vars: see env.dev.example / env.prod.example next to
# this file. All ${VAR:?} vars are REQUIRED — the deploy fails loudly
# instead of building a wrongly-wired bundle.
#
# WHY THE ${STACK}- PREFIXES EXIST (do not remove them):
# all stacks share the external "proxy" network so NPM can reach them.
# Docker DNS registers every service's bare name on every network it
# joins — with two stacks up, a bare name like "minio" resolves to
# BOTH stacks' containers and traffic crosses environments (dev api
# writing to prod db). So: inter-service URLs and NPM forward targets
# use the unique ${STACK}-<name> aliases, never bare service names,
# and the db tier sits on a per-stack internal network only.
#
# NPM proxy hosts forward BY ALIAS over the proxy network:
#   {api-vhost}            → ${STACK}-api:80
#   {auth-vhost}           → ${STACK}-ui:80
#   {rtc-vhost}            → ${STACK}-rtc:80
#   {minio-vhost}          → ${STACK}-minio:9000  (S3 API — NOT 9001)
#   {social-vhost}         → ${STACK}-social:80
#   {marketing-vhost}      → ${STACK}-marketing-ui:80
#   {marketing-api-vhost}  → ${STACK}-marketing-api:80
#
# Frontends bake their backend origins at BUILD time (vite). The
# build args below are the lane-E side of the contract; the app-side
# ARG/env plumbing is DONE for all three frontends: ui (B5,
# REACT_APP_* names), marketing-ui and web10-social (VITE_* names).
# Changing an origin means re-BUILDING the stack, not just restarting.

services:
  clickhouse:
    # Mirrored to our GHCR namespace (ghcr-mirror.yml) — see e2e/mirror-images.json.
    image: ghcr.io/jacoby149/base-clickhouse:latest
    environment:
      CLICKHOUSE_DB: web10
      CLICKHOUSE_USER: web10
      CLICKHOUSE_PASSWORD: web10
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../clickhouse-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - ${STACK}-clickhouse

  minio:
    # Mirrored to our GHCR namespace (ghcr-mirror.yml) — see e2e/mirror-images.json.
    image: ghcr.io/jacoby149/base-minio:latest
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      # Required — the S3 API is reachable via NPM, so the default
      # minioadmin password must never ship.
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in the stack env vars}
      MINIO_CONSOLE_ADDRESS: ":9001"
    command: server /data --console-address :9001
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - ${STACK}-minio
      proxy:
        aliases:
          - ${STACK}-minio
          # public minio hostname, so in-network services resolving
          # presigned-URL hosts reach it without leaving the box
          - ${MINIO_HOST:?set MINIO_HOST, e.g. minio.dev.web10.app}

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    depends_on:
      - minio
      - clickhouse
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PROVIDER: ${PROVIDER:?set PROVIDER, e.g. api.dev.web10.app}
      CLICKHOUSE_HOST: ${STACK}-clickhouse
      CLICKHOUSE_PORT: 8123
      S3_ENDPOINT: http://${STACK}-minio:9000
      # Presigned upload/read URLs are signed with THIS host and handed to the
      # browser, so it must be the public HTTPS MinIO vhost (NPM → ${STACK}-minio:9000),
      # not the internal ${STACK}-minio:9000 — otherwise the browser gets an
      # unreachable, HTTP-only URL and Mixed-Content-blocks the upload. Signing
      # is offline so the API never connects here.
      S3_PUBLIC_ENDPOINT: https://${MINIO_HOST}
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      CORS_SERVICE_MANAGERS: ${CORS_SERVICE_MANAGERS:?authenticator hosts only}
      # TURN relay for WebRTC P2P. Set TURN_URL to the public TURN URI
      # (e.g. turn:turn.web10.app:3478) and TURN_SECRET to a strong random
      # string matching the turn service's --static-auth-secret.
      # Leave both empty to run STUN-only (no relay).
      TURN_URL: ${TURN_URL:-}
      TURN_SECRET: ${TURN_SECRET:-}
    command: ["uv", "run", "gunicorn", "-b", "0.0.0.0:80", "-w", "4", "-k", "uvicorn.workers.UvicornWorker", "app.main:app"]
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - ${STACK}-api
      proxy:
        aliases:
          - ${STACK}-api

  ui:
    build:
      # Repo-root context so the Dockerfile can COPY sdk/dist/ (the v3 SDK
      # the auth app depends on). Mirrors .github/workflows/docker.yml.
      context: ..
      dockerfile: ui/Dockerfile
      args:
        # names must match ui/Dockerfile's declared ARGs (B5, 1.0.65)
        REACT_APP_API_ORIGIN: ${API_ORIGIN:?e.g. https://api.dev.web10.app}
        REACT_APP_AUTH_ORIGIN: ${AUTH_ORIGIN:?e.g. https://auth.dev.web10.app}
        REACT_APP_RTC_ORIGIN: ${RTC_ORIGIN:?e.g. https://rtc.dev.web10.app}
        REACT_APP_DEFAULT_API: ${API_HOST:?host only, e.g. api.dev.web10.app}
        # D56: full-platform telemetry (empty = tracking off for this env)
        VITE_GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
        VITE_HOTJAR_SITE_ID: ${HOTJAR_SITE_ID:-}
    environment:
      PORT: "80"
    restart: unless-stopped
    networks:
      proxy:
        aliases:
          - ${STACK}-ui

  rtc:
    build:
      context: ../api/rtc
      dockerfile: Dockerfile
    command: ["bun", "run", "index.ts"]
    environment:
      PORT: "80"
    restart: unless-stopped
    networks:
      proxy:
        aliases:
          - ${STACK}-rtc

  turn:
    # TURN relay for WebRTC P2P (coturn, RFC 8484 time-based credentials).
    # Peers connect to it DIRECTLY (UDP/TCP straight from the browser — the
    # NPM proxy cannot forward UDP), so it publishes its ports on the host
    # instead of riding the proxy network. The API mints short-lived
    # credentials (TURN_SECRET must match --static-auth-secret below) and
    # hands them to clients via POST /ice.
    #
    # REQUIREMENTS before this service is healthy in production:
    #   1. The image is mirrored (e2e/mirror-images.json + ghcr-mirror.yml).
    #   2. TURN_URL + TURN_SECRET are set in the stack env (TURN_URL is the
    #      public URI, e.g. turn:turn.{zone}:3478 — DNS must point turn.{zone}
    #      at this host's public IP; see sync-dns.py).
    #   3. The host firewall allows UDP 3478 + TCP 3478/5349 + UDP 49152-65535.
    # TLS (turns:// on 5349) is the recommended production transport; it needs
    # a cert for the TURN hostname — until one is provisioned the service runs
    # plain (turn: on 3478), which is fine on most networks.
    # The image's entrypoint auto-prepends `turnserver`, so `command` is flags only.
    # --static-auth-secret uses ${TURN_SECRET:-} (optional, not :?) so the file
    # still parses when the turn profile is off. If you enable the profile, set
    # TURN_SECRET in the stack env (it must match the api's TURN_SECRET).
    image: ghcr.io/jacoby149/base-coturn:latest
    profiles: ["turn"]
    command: >
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-}
      --listening-port=3478
      --min-port=49152
      --max-port=65535
      --no-tls
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49152-65535:49152-65535/udp"
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - ${STACK}-turn

  social:
    build:
      # Repo-root context so the Dockerfile can COPY sdk/ + nginx.conf (the
      # social app depends on the local web10-npm file: dependency since
      # D46). Same pattern as the ui service — the Dockerfile's own header
      # documents this requirement.
      context: ..
      dockerfile: marketing/web10-social/Dockerfile
      args:
        VITE_API_ORIGIN: ${API_ORIGIN}
        VITE_AUTH_ORIGIN: ${AUTH_ORIGIN}
        VITE_RTC_ORIGIN: ${RTC_ORIGIN}
        VITE_MARKETING_API: ${MARKETING_API_ORIGIN:?e.g. https://marketing-api.dev.web10.app}
        VITE_MARKETING_ORIGIN: ${MARKETING_UI_ORIGIN:-https://marketing.web10.app}
        # D56: full-platform telemetry (empty = tracking off for this env)
        VITE_GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
        VITE_HOTJAR_SITE_ID: ${HOTJAR_SITE_ID:-}
    environment:
      # Link-preview edge split (KB: media/thumbnailing.md): the social nginx
      # proxies a social permalink to the SOCIAL APP'S OWN preview server (a
      # small Node process in this same container) for known link-preview
      # crawlers. The node stays 100% generic (D60) — it answers
      # "what's the picture for this doc?" (media/thumbnail) and "render a card
      # from this spec" (preview/render); the preview server is the social part
      # (permalink → doc → card content).
      # PREVIEW_TARGET — the nginx template's proxy target (the preview server,
      # same container, localhost). envsubst'd into the nginx template at boot.
      PREVIEW_TARGET: http://127.0.0.1:3001
      # API_ORIGIN — the preview server's origin for the node (the same-stack
      # api alias over the shared proxy network). This is the container's
      # RUNTIME env (internal origin); the VITE build arg VITE_API_ORIGIN above
      # is the public origin (a separate variable) — no conflict.
      API_ORIGIN: http://${STACK}-api:80
      # SOCIAL_ORIGIN — the social app's public origin (the canonical og:url
      # the preview server puts in the card).
      SOCIAL_ORIGIN: ${SOCIAL_ORIGIN:-http://social.localhost}
      # PREVIEW_PORT — the preview server's port (matches PREVIEW_TARGET).
      PREVIEW_PORT: "3001"
    restart: unless-stopped
    networks:
      proxy:
        aliases:
          - ${STACK}-social

  marketing-ui:
    build:
      # Repo-root context so build-status.sh can read the live CHANGELOG.md
      # + .git at build time. This makes /status self-sufficient even when
      # the rebuild runs WITHOUT the GIT_COMMIT / STATUS_VERSION env vars —
      # i.e. Portainer's 5-min GitOps poll, which used to leave version +
      # commit stuck on "unknown" on prod while dev (deployed via the SSH
      # action that exports those vars) showed real values.
      context: ..
      dockerfile: marketing/marketing-ui/Dockerfile
      args:
        VITE_API_URL: ${API_ORIGIN}
        VITE_MARKETING_API: ${MARKETING_API_ORIGIN}
        VITE_GIT_COMMIT: ${GIT_COMMIT:-}
        VITE_AUTH_URL: ${AUTH_ORIGIN}
        VITE_SOCIAL_URL: ${SOCIAL_ORIGIN:-}
        VITE_MARKETING_URL: ${MARKETING_UI_ORIGIN:-}
        STATUS_VERSION: ${STATUS_VERSION:-}
        # D56: full-platform telemetry (empty = tracking off for this env)
        VITE_GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
        VITE_HOTJAR_SITE_ID: ${HOTJAR_SITE_ID:-}
    restart: unless-stopped
    networks:
      proxy:
        aliases:
          - ${STACK}-marketing-ui

  marketing-api:
    build:
      context: ../marketing/marketing-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_API_URL: ${NODE_API_URL:-}
      NODE_API_TOKEN: ${NODE_API_TOKEN:-}
    networks:
      proxy:
        aliases:
          - ${STACK}-marketing-api

volumes:
  # Portainer prefixes volume names with the stack name, so each
  # stack gets its own minio-data / clickhouse-data automatically.
  minio-data:
  clickhouse-data:

networks:
  # per-stack private network for the db tier — never on "proxy"
  internal:
  proxy:
    external: true
