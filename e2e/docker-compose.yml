# E2E compose — brings up the full web10 stack for Playwright smoke tests.
# Usage: docker compose -f e2e/docker-compose.yml up --build -d
# Then: cd e2e && npx playwright test

services:
  proxy:
    image: nginxproxy/nginx-proxy:1.6
    ports:
      - "${E2E_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - e2e-net

  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17
    environment:
      - POSTGRES_USER=web10
      - POSTGRES_PASSWORD=web10
      - POSTGRES_DB=postgres
    networks:
      - e2e-net

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2
    depends_on:
      - postgres
    environment:
      - FERRETDB_POSTGRESQL_URL=postgres://web10:web10@postgres:5432/postgres
    networks:
      - e2e-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    volumes:
      - ../clickhouse-init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_DB=web10
      - CLICKHOUSE_USER=web10
      - CLICKHOUSE_PASSWORD=web10
      - CLICKHOUSE_DO_NOT_CHOWN=1
    networks:
      - e2e-net

  api:
    build: ../api
    depends_on:
      - ferretdb
      - minio
      - clickhouse
    volumes:
      - ../api:/web10
    environment:
      VIRTUAL_HOST: api.localhost
      PROVIDER: api.localhost
      DB_URL: mongodb://web10:web10@ferretdb:27017/
      DB: web10
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      CORS_SERVICE_MANAGERS: auth.localhost,social.localhost,marketing.localhost
      STRIPE_STATUS: test
      STRIPE_TEST_KEY: ${STRIPE_TEST_KEY:-sk_test_placeholder}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: web10
      CLICKHOUSE_USER: web10
      CLICKHOUSE_PASSWORD: web10
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80", "--reload"]
    networks:
      - e2e-net

  ui:
    build:
      # Repo-root context so the Dockerfile can COPY sdk/dist/ (the v3 SDK
      # the auth app depends on). Mirrors .github/workflows/docker.yml.
      context: ..
      dockerfile: ui/Dockerfile
      target: dev
    volumes:
      - ../ui:/ui
      - ui-node-modules:/ui/node_modules
    command: ["bun", "run", "dev"]
    environment:
      PORT: "80"
      VIRTUAL_HOST: auth.localhost
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_DEFAULT_API: api.localhost
      REACT_APP_VERIFY_REQUIRED: "false"
    networks:
      - e2e-net

  rtc:
    build: ../api/rtc
    volumes:
      - ../api/rtc:/rtc
    command: ["bun", "run", "dev"]
    environment:
      PORT: "80"
      VIRTUAL_HOST: rtc.localhost
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - e2e-net

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address :9001
    networks:
      - e2e-net

  sdk:
    build: ../sdk
    environment:
      VIRTUAL_HOST: sdk.localhost
    networks:
      - e2e-net

  marketing-ui:
    build:
      # Repo-root context — the Dockerfile COPYs marketing/marketing-ui/*
      # paths and bakes status from the context root (mirrors
      # docker-compose.ecosystem.yml and cd.yml since 1.0.131/1.0.133).
      context: ..
      dockerfile: marketing/marketing-ui/Dockerfile
    environment:
      VIRTUAL_HOST: marketing.localhost
    networks:
      - e2e-net

  marketing-api:
    build: ../marketing/marketing-api
    environment:
      VIRTUAL_HOST: marketing-api.localhost
      NODE_API_URL: http://api.localhost
      NODE_API_TOKEN: ""
    networks:
      - e2e-net

  web10-social:
    build:
      context: ../marketing/web10-social
      dockerfile: ../../e2e/Dockerfile.social
    environment:
      VIRTUAL_HOST: social.localhost
      VIRTUAL_PORT: "3000"
      # Without these, src/lib/origins.ts's API_ORIGIN/AUTH_ORIGIN/
      # MARKETING_ORIGIN constants fall back to the production hosts
      # (https://api.web10.app etc.) — Vite dev server reads VITE_*  env
      # vars at runtime, no rebuild needed. Only code going through
      # Web10SocialAdapter's own wapiInit() client (CRUD) already
      # auto-detects *.localhost; anything using these constants directly
      # via a raw fetch() (discover/suggested-users, the public ledger)
      # was silently calling the real internet instead of this stack.
      VITE_API_ORIGIN: http://api.localhost
      VITE_AUTH_ORIGIN: http://auth.localhost
      VITE_MARKETING_ORIGIN: http://marketing.localhost
    networks:
      - e2e-net

volumes:
  minio-data:
  ui-node-modules:

networks:
  e2e-net: