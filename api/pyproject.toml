[project]
name = "web10-api"
version = "0.1.0"
description = "web10 node API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23",
    "PyJWT>=2.9",
    "pymongo>=4.8",
    "clickhouse-connect>=0.8",
    # The flexible-read boundary (safe_query.py) parses caller SQL into an AST
    # and injects the group filter; sqlglot's ClickHouse dialect is the parser.
    "sqlglot>=26",
    "uuid6>=2024.1.12",
    "boto3>=1.35",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 (unmaintained) reads bcrypt.__about__, removed in
    # bcrypt 4.1 -- newer bcrypt makes every signup/login 500.
    "bcrypt<4.1",
    "stripe>=11",
    "twilio>=9",
    "python-multipart>=0.0.10",
    "requests>=2.32",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-mock>=3.12",
]

# uv installs this group by default on `uv sync`, so CI's
# `uv sync --frozen` gets ruff + pytest without extra flags.
[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-mock>=3.12",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "E402",   # module level import not at top of file (legacy code pattern)
    "E501",   # line too long (will fix when touching the code)
    "E701",   # multiple statements on one line (will fix when touching the code)
    "E722",   # bare except (will fix when touching the code)
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports are the package's public surface

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
