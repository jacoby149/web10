<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Messages — web10 Demo</title>
  <style>
    :root {
      --bg: #09090b;
      --fg: #fafafa;
      --muted: #a1a1aa;
      --surface: #111113;
      --elevated: #18181b;
      --border: #27272a;
      --brand: #8b5cf6;
      --brand-300: #c4b5fd;
      --brand-muted: #2e1065;
      --danger: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 560px; margin: 0 auto; }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .subtitle { color: var(--muted); font-size: 0.875rem; line-height: 1.5; margin-bottom: 1.5rem; }
    .auth-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    button {
      background: var(--brand);
      color: var(--fg);
      border: none;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms ease-out;
    }
    button:hover { background: #7c3aed; }
    button.secondary {
      background: var(--elevated);
      border: 1px solid var(--border);
    }
    button.secondary:hover { background: var(--border); }
    button.danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    button.danger:hover { background: #450a0a; }
    input, textarea {
      width: 100%;
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 0.875rem;
      font-family: inherit;
      resize: vertical;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 2px var(--brand-muted);
    }
    .field-label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0 0 0.375rem 0.125rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .row > .col { flex: 1; }
    textarea.text { min-height: 60px; }
    .create-row {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-bottom: 2rem;
    }
    .message {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .message-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .message-from { color: var(--brand-300); }
    .message-text {
      font-size: 0.875rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 0.5rem;
    }
    .message-actions button {
      padding: 0.375rem 0.75rem;
      font-size: 0.75rem;
    }
    #message {
      font-size: 0.8125rem;
      color: var(--brand-300);
    }
    code {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      background: var(--brand-muted);
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      font-size: 0.8125rem;
    }
    .empty {
      color: var(--muted);
      font-size: 0.875rem;
      text-align: center;
      padding: 2rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Messages</h1>
    <p class="subtitle">A DM-style demo: send messages between web10 nodes. Each message lives in the recipient's <code>web10-docs-message-demo</code> collection.</p>

    <div class="auth-row">
      <button id="authButton">Log in</button>
      <span id="message">Not started — log in to begin.</span>
    </div>

    <div id="editor" style="display:none;">
      <label class="field-label" for="toUsername">To (username)</label>
      <div class="row">
        <div class="col">
          <input id="toUsername" placeholder="alice" autocomplete="off" />
        </div>
        <div class="col">
          <input id="toProvider" placeholder="auth.web10.app" autocomplete="off" />
        </div>
      </div>
      <label class="field-label" for="body">Message</label>
      <textarea id="body" class="text" placeholder="Write a message…"></textarea>
      <div class="create-row">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <div id="messageview"></div>
  </div>

  <!-- web10 SDK: self-hosted (the old auth.web10.app/sdk/wapi.js path 404s
       since the SDK moved to npm). Served from /docs/wapi.js on this site. -->
  <script src="../wapi.js"></script>
  <script src="script.js"></script>
</body>
</html>
</content>
</invoke>
