<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feed — web10 Demo</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="description" content="A social feed: post to the public discover board, follow creators, read one combined feed." />
  <meta name="theme-color" content="#09090b" />
  <link rel="apple-touch-icon" href="/brand/icon-192.png" />
  <style>
    :root {
      --bg: #09090b;
      --fg: #fafafa;
      --muted: #a1a1aa;
      --surface: #111113;
      --elevated: #18181b;
      --border: #27272a;
      --brand: #8b5cf6;
      --brand-300: #c4b5fd;
      --brand-muted: #2e1065;
      --danger: #ef4444;
      --ok: #22c55e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 560px; margin: 0 auto; }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .subtitle { color: var(--muted); font-size: 0.875rem; line-height: 1.5; margin-bottom: 1.5rem; }
    .auth-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    button {
      background: var(--brand);
      color: var(--fg);
      border: none;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms ease-out;
    }
    button:hover { background: #7c3aed; }
    button.secondary {
      background: var(--elevated);
      border: 1px solid var(--border);
    }
    button.secondary:hover { background: var(--border); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    textarea, input {
      width: 100%;
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 0.875rem;
      font-family: inherit;
      resize: vertical;
      margin-bottom: 0.75rem;
    }
    textarea { min-height: 60px; }
    textarea:focus, input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 2px var(--brand-muted);
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .panel h3 {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.75rem;
    }
    .create-row {
      display: flex;
      gap: 0.5rem;
    }
    .follow-row {
      display: flex;
      gap: 0.5rem;
    }
    .follow-row input { margin-bottom: 0; }
    #message {
      font-size: 0.8125rem;
      color: var(--brand-300);
    }
    .feed-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin: 1.5rem 0 0.75rem;
    }
    .feed-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    .post {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .post-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .post-author {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--brand-300);
    }
    .post-date {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .post-text {
      font-size: 0.9375rem;
      line-height: 1.5;
      word-break: break-word;
    }
    .post-groups {
      margin-top: 0.5rem;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .post-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.5rem;
    }
    .post-actions button {
      padding: 0.25rem 0.625rem;
      font-size: 0.75rem;
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .post-actions button:hover { background: #450a0a; }
    .empty {
      color: var(--muted);
      font-size: 0.875rem;
      text-align: center;
      padding: 2rem 0;
    }
    code {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      background: var(--brand-muted);
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      font-size: 0.8125rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Feed</h1>
    <p class="subtitle">A social feed demo: post to the public <code>discover</code> board, follow creators (join their <code>followers</code> groups), and read one combined feed from discover + your follows — a single multi-group read.</p>

    <div class="auth-row">
      <button id="authButton">Log in</button>
      <button id="fixAccessBtn" class="secondary" style="display:none;">Fix access</button>
      <span id="message">Not started — log in to begin.</span>
    </div>

    <div id="editor" style="display:none;">
      <div class="panel">
        <h3>Post to discover</h3>
        <textarea id="postText" placeholder="Share something with the public board…"></textarea>
        <div class="create-row">
          <button id="postBtn" data-testid="post-button">Post to discover</button>
        </div>
      </div>

      <div class="panel">
        <h3>Follow a creator</h3>
        <div class="follow-row">
          <input id="creatorUsername" placeholder="creator username" data-testid="creator-input" />
          <button id="followBtn" data-testid="follow-button">Follow</button>
        </div>
      </div>
    </div>

    <div id="feed" style="display:none;">
      <h2 class="feed-title">Your feed</h2>
      <div class="feed-meta" id="feedMeta"></div>
      <div id="feedList"></div>
    </div>
  </div>

  <!-- web10 SDK: self-hosted, served from /docs/wapi.js on this site. -->
  <script src="../wapi.js"></script>
  <script src="script.js"></script>
</body>
</html>
