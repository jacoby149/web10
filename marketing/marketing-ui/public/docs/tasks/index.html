<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tasks — web10 Demo</title>
  <style>
    :root {
      --bg: #09090b;
      --fg: #fafafa;
      --muted: #a1a1aa;
      --surface: #111113;
      --elevated: #18181b;
      --border: #27272a;
      --brand: #8b5cf6;
      --brand-300: #c4b5fd;
      --brand-muted: #2e1065;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 560px; margin: 0 auto; }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .subtitle { color: var(--muted); font-size: 0.875rem; line-height: 1.5; margin-bottom: 1.5rem; }
    .auth-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    button {
      background: var(--brand);
      color: var(--fg);
      border: none;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms ease-out;
    }
    button:hover { background: #7c3aed; }
    button.secondary {
      background: var(--elevated);
      border: 1px solid var(--border);
    }
    button.secondary:hover { background: var(--border); }
    button.danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    button.danger:hover { background: #450a0a; }
    button.success {
      background: var(--success);
      color: #000;
    }
    button.success:hover { background: #16a34a; }
    input {
      width: 100%;
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 0.875rem;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 2px var(--brand-muted);
    }
    .field-label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0 0 0.375rem 0.125rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .row > .col { flex: 1; }
    .create-row {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-bottom: 2rem;
    }
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .section-title {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--brand-300);
    }
    .task {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }
    .task:last-child { border-bottom: none; }
    .task input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--brand);
      cursor: pointer;
      flex-shrink: 0;
    }
    .task-text {
      flex: 1;
      font-size: 0.875rem;
      line-height: 1.4;
    }
    .task-text.done {
      text-decoration: line-through;
      color: var(--muted);
    }
    .task-actions {
      display: flex;
      gap: 0.375rem;
    }
    .task-actions button {
      padding: 0.25rem 0.5rem;
      font-size: 0.6875rem;
    }
    .member {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.8125rem;
    }
    .member:last-child { border-bottom: none; }
    .member-role {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.6875rem;
      color: var(--brand-300);
      background: var(--brand-muted);
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
    }
    #message {
      font-size: 0.8125rem;
      color: var(--brand-300);
    }
    code {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      background: var(--brand-muted);
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      font-size: 0.8125rem;
    }
    .empty {
      color: var(--muted);
      font-size: 0.875rem;
      text-align: center;
      padding: 1.5rem 0;
    }
    .group-id {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tasks</h1>
    <p class="subtitle">A groups demo: create a group with roles, add tasks, and invite members. Tasks are documents attached to the group — members discover them via membership.</p>

    <div class="auth-row">
      <button id="authButton">Log in</button>
      <span id="message">Not started — log in to begin.</span>
    </div>

    <div id="app" style="display:none;">
      <!-- Group creation -->
      <div class="section" id="groupSection">
        <div class="section-title">Create Group</div>
        <label class="field-label" for="groupName">Group name</label>
        <input id="groupName" placeholder="my-project" autocomplete="off" />
        <div class="row" style="margin-top:0.5rem">
          <div class="col">
            <label class="field-label" for="joinPolicy">Join policy</label>
            <select id="joinPolicy" style="width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:0.5rem;padding:0.75rem;font-size:0.875rem;font-family:inherit;">
              <option value="open">Open</option>
              <option value="request">Request</option>
              <option value="invite_only" selected>Invite only</option>
            </select>
          </div>
        </div>
        <div class="create-row">
          <button onclick="createGroup()">Create group</button>
        </div>
      </div>

      <!-- Active group info -->
      <div id="activeGroup" style="display:none;">
        <div class="section">
          <div class="section-title">Group</div>
          <div class="group-id" id="groupId"></div>

          <!-- Task creation -->
          <label class="field-label" for="taskText">New task</label>
          <div class="row">
            <div class="col">
              <input id="taskText" placeholder="Add a task…" autocomplete="off" />
            </div>
            <div style="flex-shrink:0; display:flex; align-items:flex-end;">
              <button onclick="createTask()">Add</button>
            </div>
          </div>

          <!-- Tasks list -->
          <div id="taskview" style="margin-top:0.75rem;"></div>
        </div>

        <!-- Members -->
        <div class="section">
          <div class="section-title">Members</div>
          <div id="memberlist"></div>
          <div style="margin-top:0.75rem">
            <label class="field-label" for="inviteUsername">Invite member</label>
            <div class="row">
              <div class="col">
                <input id="inviteUsername" placeholder="username" autocomplete="off" />
              </div>
              <div class="col" style="max-width:120px">
                <label class="field-label" for="inviteRole">Role</label>
                <select id="inviteRole" style="width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:0.5rem;padding:0.75rem;font-size:0.875rem;font-family:inherit;">
                  <option value="contributor">Contributor</option>
                  <option value="viewer">Viewer</option>
                </select>
              </div>
              <div style="flex-shrink:0; display:flex; align-items:flex-end;">
                <button onclick="inviteMember()">Invite</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../wapi.js"></script>
  <script src="script.js"></script>
</body>
</html>
