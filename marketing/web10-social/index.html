<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="web10 social — your audience. No shadow ban. 100% delivery by architecture." />
    <!-- Static Open Graph / Twitter Card fallback (D71). Post permalinks get
         per-post tags rendered by the node (the share-preview endpoint); these
         cover the app root + any non-post route a link might point at. The
         image is the brand mark; crawlers resolve it against the page origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="web10" />
    <meta property="og:title" content="web10 social" />
    <meta property="og:description" content="Your audience. No shadow ban. 100% delivery by architecture." />
    <meta property="og:image" content="/keys-mark.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="web10 social" />
    <meta name="twitter:description" content="Your audience. No shadow ban. 100% delivery by architecture." />
    <meta name="twitter:image" content="/keys-mark.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>web10 social</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- web10 SDK browser build (the D42 auth flow: openAuthPortal +
         contractRequest + authListen). Self-hosted, same pattern as the
         demos' docs/wapi.js. KEEP IN SYNC with sdk/dist/browser.js —
         the Dockerfile should rebuild it from source (see .context note). -->
    <script src="/wapi.js"></script>
    <!-- hls.js (vendored): adaptive-bitrate HLS playback for transcoded video
         posts (D44 — the media demo's player is the reference). No CDN dep. -->
    <script src="/hls.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/registerWorker.js"></script>
  </body>
</html>
