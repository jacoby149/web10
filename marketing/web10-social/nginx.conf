# web10-social — the SPA + the share-preview edge split (D71).
#
# This is an nginx TEMPLATE: the `nginx:alpine` image envsubst's
# /etc/nginx/templates/*.template into /etc/nginx/conf.d/ at boot, so the
# ${API_PROXY_TARGET} below is filled from the container env (injected per
# env by the deploy compose — e.g. http://web10-prod-api:80). The Dockerfile
# copies this file to /etc/nginx/templates/default.conf.template.
#
# THE SHARE-PREVIEW SPLIT (D71): the post permalink (/u/:username/p/:postId)
# is a SPA route. A link-preview crawler (Facebook, iMessage/Apple, X, Slack,
# WhatsApp, Telegram, Discord, …) does not run JS, so it needs the post's Open
# Graph tags from the NODE, not the static index.html. When the User-Agent is
# a known crawler, the permalink is proxied to the node's share-preview
# endpoint (GET /v3/share/post/:username/:post_id), which renders the tags.
# Everything else — every browser — gets the SPA exactly as before.
#
# Browser-default: an unknown agent gets the working app, never a broken
# preview. The only failure mode is a crawler with an unmatchable User-Agent,
# which degrades to "no preview card" (the same as before this change).

# Case-insensitive substring match on the User-Agent → 1 for known
# link-preview crawlers, 0 otherwise. The set is the standard social/link
# preview bot list; add a bot here when a platform stops previewing.
map $http_user_agent $is_link_preview_crawler {
    default                                0;
    "~*facebookexternalhit"                1;
    "~*facebookcatalog"                    1;
    "~*twitterbot"                         1;
    "~*linkedinbot"                        1;
    "~*slackbot"                           1;
    "~*slack-imgproxy"                     1;
    "~*whatsapp"                           1;
    "~*telegrambot"                        1;
    "~*telegram"                           1;
    "~*discordbot"                         1;
    "~*pinterest"                          1;
    "~*vkshare"                            1;
    "~*odnoklassniki"                      1;
    "~*live"                               1;
    "~*yandex"                             1;
    "~*bingbot"                            1;
    "~*applebot"                           1;
    "~*line"                               1;
    "~*quora link preview"                 1;
    "~*showyoubot"                         1;
    "~*embedly"                            1;
    "~*pocket"                             1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The post permalink: hand known crawlers to the node (which renders the
    # Open Graph / Twitter Card tags from the post), everyone else the SPA.
    # The regex captures :username and :post_id and forwards them to the
    # node's share-preview endpoint.
    location ~ ^/u/(?<share_username>[^/]+)/p/(?<share_post_id>[^/]+)$ {
        # The node target is a Docker service name (e.g. web10-prod-api) that
        # nginx must resolve at request time — that needs the Docker embedded
        # DNS resolver (127.0.0.11), which is present in every Docker network.
        # `valid=30s` re-resolves periodically so a recreated API container is
        # picked up without a reload.
        resolver 127.0.0.11 valid=30s ipv6=off;
        # proxy_set_header is NOT allowed inside `if` (only proxy_pass is), so
        # it lives at the location level — it only takes effect when the
        # proxy_pass below actually runs (the crawler path); the browser path
        # (try_files) never proxies, so these headers are inert there.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($is_link_preview_crawler) {
            proxy_pass ${API_PROXY_TARGET}/v3/share/post/$share_username/$share_post_id;
        }
        # Default (browser): fall through to the SPA.
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
