# web10-social — the SPA + the link-preview edge split (KB:
# media/thumbnailing.md).
#
# This is an nginx TEMPLATE: the `nginx:alpine` image envsubst's
# /etc/nginx/templates/*.template into /etc/nginx/conf.d/ at boot. The
# Dockerfile copies this file to /etc/nginx/templates/default.conf.template.
#
# THE LINK-PREVIEW SPLIT: a social permalink (/u/:username/p/:postId,
# /u/:username) is a SPA route. A link-preview crawler (Facebook,
# iMessage/Apple, X, Slack, WhatsApp, Telegram, Discord, …) does not run JS, so
# it needs the permalink's Open Graph tags, not the static index.html. When the
# User-Agent is a known crawler, the permalink is proxied to the SOCIAL APP'S
# OWN preview server (a small Node process in this same container, on
# PREVIEW_PORT) — the social-specific tail of the generic thumbnailing
# primitive. The preview server maps the permalink → a doc, reads it via the
# node's generic read, picks the thumbnail via the node's generic
# `media/thumbnail`, and asks the node's generic `preview/render` for the card
# HTML. The NODE stays 100% generic (D60) — it knows nothing about posts,
# profiles, or the /u/:username permalink.
#
# Everything else — every browser — gets the SPA exactly as before.
#
# Browser-default: an unknown agent gets the working app, never a broken
# preview. The only failure mode is a crawler with an unmatchable User-Agent,
# which degrades to "no preview card" (the same as before this change).

# Case-insensitive substring match on the User-Agent → 1 for known
# link-preview crawlers, 0 otherwise. The set is the standard social/link
# preview bot list; add a bot here when a platform stops previewing.
map $http_user_agent $is_link_preview_crawler {
    default                                0;
    "~*facebookexternalhit"                1;
    "~*facebookcatalog"                    1;
    "~*twitterbot"                         1;
    "~*linkedinbot"                        1;
    "~*slackbot"                           1;
    "~*slack-imgproxy"                     1;
    "~*whatsapp"                           1;
    "~*telegrambot"                        1;
    "~*telegram"                           1;
    "~*discordbot"                         1;
    "~*pinterest"                          1;
    "~*vkshare"                            1;
    "~*odnoklassniki"                      1;
    "~*live"                               1;
    "~*yandex"                             1;
    "~*bingbot"                            1;
    "~*applebot"                           1;
    "~*line"                               1;
    "~*quora link preview"                 1;
    "~*showyoubot"                         1;
    "~*embedly"                            1;
    "~*pocket"                             1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The post permalink: hand known crawlers to the social app's preview
    # server (which renders the Open Graph / Twitter Card from the post),
    # everyone else the SPA. The regex captures :username and :post_id and
    # forwards the permalink to the preview server (same container, localhost).
    location ~ ^/u/(?<share_username>[^/]+)/p/(?<share_post_id>[^/]+)$ {
        # The preview server is in this same container (localhost) — no Docker
        # DNS resolver needed. ${PREVIEW_TARGET} is envsubst'd at boot (default
        # http://127.0.0.1:3001, the preview server's port).
        # proxy_set_header is NOT allowed inside `if` (only proxy_pass is), so
        # it lives at the location level — it only takes effect when the
        # proxy_pass below actually runs (the crawler path); the browser path
        # (try_files) never proxies, so these headers are inert there.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($is_link_preview_crawler) {
            proxy_pass ${PREVIEW_TARGET}/u/$share_username/p/$share_post_id;
        }
        # Default (browser): fall through to the SPA.
        try_files /index.html =404;
    }

    # The profile permalink (/u/:username, no /p/:postId): the same edge split
    # for a profile's link preview — known crawlers get the social app's
    # preview server (the profile's face: avatar + name + bio), everyone else
    # the SPA. Mutually exclusive with the post permalink above (this regex
    # requires the path to end right after the username).
    location ~ ^/u/(?<share_username>[^/]+)$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($is_link_preview_crawler) {
            proxy_pass ${PREVIEW_TARGET}/u/$share_username;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
