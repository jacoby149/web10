# web10-social — the SPA + the link-preview edge split (KB:
# media/thumbnailing.md).
#
# This is an nginx TEMPLATE: the `nginx:alpine` image envsubst's
# /etc/nginx/templates/*.template into /etc/nginx/conf.d/ at boot. The
# Dockerfile copies this file to /etc/nginx/templates/default.conf.template.
#
# THE LINK-PREVIEW SPLIT: a social permalink (/u/:username/p/:postId,
# /u/:username) is a SPA route. A link-preview crawler (Facebook,
# iMessage/Apple, X, Slack, WhatsApp, Telegram, Discord, …) does not run JS, so
# it needs the permalink's Open Graph tags, not the static index.html. When the
# User-Agent is a known crawler, the permalink is proxied to the SOCIAL APP'S
# OWN preview server (a small Node process in this same container, on
# PREVIEW_PORT) — the social-specific tail of the generic thumbnailing
# primitive. The preview server maps the permalink → a doc, reads it via the
# node's generic read, picks the thumbnail via the node's generic
# `media/thumbnail`, and asks the node's generic `preview/render` for the card
# HTML. The NODE stays 100% generic (D60) — it knows nothing about posts,
# profiles, or the /u/:username permalink.
#
# Everything else — every browser — gets the SPA exactly as before.
#
# Browser-default: an unknown agent gets the working app, never a broken
# preview. The only failure mode is a crawler with an unmatchable User-Agent,
# which degrades to "no preview card" (the same as before this change).
#
# One NON-crawler route: GET /preview/unfurl (the link unfurl — the SPA asks
# the preview server for a pasted link's card metadata; every user-agent is
# proxied, see the location block near the bottom).

# Case-insensitive substring match on the User-Agent → 1 for known
# link-preview crawlers, 0 otherwise. The set is the standard social/link
# preview bot list; add a bot here when a platform stops previewing.
map $http_user_agent $is_link_preview_crawler {
    default                                0;
    "~*facebookexternalhit"                1;
    "~*facebookcatalog"                    1;
    "~*twitterbot"                         1;
    "~*linkedinbot"                        1;
    "~*slackbot"                           1;
    "~*slack-imgproxy"                     1;
    "~*whatsapp"                           1;
    "~*telegrambot"                        1;
    "~*telegram"                           1;
    "~*discordbot"                         1;
    "~*pinterest"                          1;
    "~*vkshare"                            1;
    "~*odnoklassniki"                      1;
    "~*live"                               1;
    "~*yandex"                             1;
    "~*bingbot"                            1;
    "~*applebot"                           1;
    "~*line"                               1;
    "~*quora link preview"                 1;
    "~*showyoubot"                         1;
    "~*embedly"                            1;
    "~*pocket"                             1;
}

# The group permalink and every other ENCODED group id: the SPA encodes the
# group id (which contains slashes) as %2F in a SINGLE path segment. nginx
# normalizes (decodes) the request URI BEFORE location matching, so a
# `^/groups/([^/]+)$` regex can never match a real encoded group id — the
# crawler request falls through to the SPA. The maps below match the RAW
# request URI ($request_uri is NOT decoded) instead, and the proxy passes it
# through verbatim: the preview server's route regexes see one literal
# segment and decodeURIComponent restores the group id. This covers the
# group face, the group post, and the group's playlists — all encoded ids.
map $request_uri $share_encoded_group {
    default                                0;
    "~^/groups/[^/]+(\?|$)"                1;
    "~^/groups/[^/]+/p/[^/]+(\?|$)"        1;
    "~^/groups/[^/]+/saved/[^/]+(\?|$)"    1;
}
# The personal playlist permalink: the username is plain, but the
# collection id is an encoded group id (%2F) — same normalization trap.
map $request_uri $share_saved_personal {
    default                                0;
    "~^/u/[^/]+/saved/[^/]+(\?|$)"         1;
}
# nginx's `if` has no `and` operator — the crawler gate + the shape match are
# combined the canonical way: a map over the two flags' joined string. Only a
# known crawler AND the encoded shape map to "1"; everything else maps to
# empty (falsy) and falls through to the SPA.
map "$is_link_preview_crawler:$share_encoded_group" $encoded_share_split {
    default                                "";
    "1:1"                                  "1";
}
map "$is_link_preview_crawler:$share_saved_personal" $saved_share_split {
    default                                "";
    "1:1"                                  "1";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The post permalink: hand known crawlers to the social app's preview
    # server (which renders the Open Graph / Twitter Card from the post),
    # everyone else the SPA. The regex captures :username and :post_id and
    # forwards the permalink to the preview server (same container, localhost).
    location ~ ^/u/(?<share_username>[^/]+)/p/(?<share_post_id>[^/]+)$ {
        # The preview server is in this same container (localhost) — no Docker
        # DNS resolver needed. ${PREVIEW_TARGET} is envsubst'd at boot (default
        # http://127.0.0.1:3001, the preview server's port).
        # proxy_set_header is NOT allowed inside `if` (only proxy_pass is), so
        # it lives at the location level — it only takes effect when the
        # proxy_pass below actually runs (the crawler path); the browser path
        # (try_files) never proxies, so these headers are inert there.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($is_link_preview_crawler) {
            proxy_pass ${PREVIEW_TARGET}/u/$share_username/p/$share_post_id;
        }
        # Default (browser): fall through to the SPA.
        try_files /index.html =404;
    }

    # The profile permalink (/u/:username, no /p/:postId): the same edge split
    # for a profile's link preview — known crawlers get the social app's
    # preview server (the profile's face: avatar + name + bio), everyone else
    # the SPA. Mutually exclusive with the post permalink above (this regex
    # requires the path to end right after the username).
    location ~ ^/u/(?<share_username>[^/]+)$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($is_link_preview_crawler) {
            proxy_pass ${PREVIEW_TARGET}/u/$share_username;
        }
        try_files /index.html =404;
    }

    # The ENCODED group permalinks (the group face, the group post, the group's
    # playlists): the SPA encodes the group id (which contains slashes) as %2F
    # in a SINGLE path segment — and nginx normalizes (decodes) the request URI
    # BEFORE location matching, so no `^/groups/([^/]+)…` regex can ever match
    # a real encoded id (a crawler request would fall through to the SPA and
    # its link preview would be the static brand card, never the group face /
    # post / playlist). These shapes therefore ride the raw-URI maps above
    # ($share_encoded_group) + the `location /` split below: the crawler gets
    # the preview server with the %2F still encoded (its route regexes see one
    # literal segment; decodeURIComponent restores the id); the browser gets
    # the SPA. A bare (unencoded) `/groups/xyz` can't exist for a real group
    # id, so no location regex is kept for it.

    # The watch permalink (/watch/:postId): the same edge split for the
    # landscape-video share link — known crawlers get the social app's preview
    # server (the post's media thumbnail + text, the same card as the post
    # permalink, a different canonical URL), everyone else the SPA.
    location ~ ^/watch/(?<share_post_id>[^/]+)$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($is_link_preview_crawler) {
            proxy_pass ${PREVIEW_TARGET}/watch/$share_post_id;
        }
        try_files /index.html =404;
    }

    # The shorts permalink (/shorts/:postId): the same edge split for the
    # vertical-video share link.
    location ~ ^/shorts/(?<share_post_id>[^/]+)$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($is_link_preview_crawler) {
            proxy_pass ${PREVIEW_TARGET}/shorts/$share_post_id;
        }
        try_files /index.html =404;
    }

    # The browser-facing link unfurl (KB: web10-v3/social/link-unfurl.md):
    # the SPA asks its OWN preview server for a pasted link's card metadata
    # (GET /preview/unfurl?url=…) and renders the rich card / provider
    # player. Unlike the permalink splits above, this is NOT a crawler
    # surface — it is same-origin JSON for every user-agent (the SPA's fetch
    # is CORS-blocked from the linked page, so the fetch happens here).
    # proxy_pass with a URI keeps the query string (?url=…) intact.
    location = /preview/unfurl {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass ${PREVIEW_TARGET}/preview/unfurl;
    }

    # Music shares keep the post id in ?track=, so forward the original query
    # string too. Browsers retain the player/queue state in the SPA unchanged.
    location = /music {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($is_link_preview_crawler) {
            proxy_pass ${PREVIEW_TARGET}$request_uri;
        }
        try_files /index.html =404;
    }

    location / {
        # The encoded-permalink crawler split (the group face, the group post,
        # the playlists — $encoded_share_split; the personal playlist —
        # $saved_share_split). Both maps are "1" only for a known crawler on
        # the exact shape; $request_uri keeps the %2F encoding the preview
        # server expects; a browser always gets the SPA below.
        if ($encoded_share_split) {
            proxy_pass ${PREVIEW_TARGET}$request_uri;
        }
        if ($saved_share_split) {
            proxy_pass ${PREVIEW_TARGET}$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }
}
